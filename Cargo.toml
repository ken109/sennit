[package]
name = "sennit"
version = "0.2.0"
edition = "2021"
description = "A dotfiles manager that keeps symlink semantics, and adds templating and drift detection"
repository = "https://github.com/ken109/sennit"
license = "MIT"
keywords = ["dotfiles", "symlink", "cli", "config"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"

[profile.release]
strip = true
opt-level = "z"
lto = true
