[package]
name = "sennit"
version = "0.10.1"
edition = "2021"
description = "A dotfiles manager that keeps symlink semantics, and adds templating and drift detection"
repository = "https://github.com/ken109/sennit"
license = "MIT"
keywords = ["dotfiles", "symlink", "cli", "config"]
categories = ["command-line-utilities"]
readme = "README.md"
homepage = "https://github.com/ken109/sennit"
# 実際にビルドとテストを通して確認した下限
rust-version = "1.90"
exclude = [".github/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"

[profile.release]
strip = true
opt-level = "z"
lto = true
