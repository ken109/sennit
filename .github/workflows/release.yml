name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      # Homebrew の formula が展開する形に合わせる(アーカイブ直下にバイナリ)
      - name: Package
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czf "sennit-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" sennit
          shasum -a 256 "sennit-${{ matrix.target }}.tar.gz" \
            > "sennit-${{ matrix.target }}.tar.gz.sha256"

      # Windows: sennit.exe at the root of the zip
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "sennit-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/sennit.exe" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value "$hash  $name.zip" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: sennit-${{ matrix.target }}
          path: sennit-${{ matrix.target }}.${{ matrix.archive }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Show checksums
        run: cat dist/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
