name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
      crate_only:
        description: "Only publish the tag to crates.io (keep the existing GitHub Release and its binaries)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    if: ${{ !inputs.crate_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      # Homebrew の formula が展開する形に合わせる(アーカイブ直下にバイナリ)
      - name: Package
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czf "sennit-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" sennit
          shasum -a 256 "sennit-${{ matrix.target }}.tar.gz" \
            > "sennit-${{ matrix.target }}.tar.gz.sha256"

      # Windows: sennit.exe at the root of the zip
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "sennit-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/sennit.exe" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value "$hash  $name.zip" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: sennit-${{ matrix.target }}
          path: sennit-${{ matrix.target }}.${{ matrix.archive }}*

  release:
    needs: build
    if: ${{ !inputs.crate_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Show checksums
        run: cat dist/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # crates.io への公開。Trusted Publishing（GitHub の OIDC）で短命のトークンを受け取るので、秘密は置かない。
  # crates.io の sennit の Settings > Trusted Publishing に、このレポと release.yml を登録してある前提。
  # GitHub Release が出来てから公開する（ビルドが落ちた版を crates.io にだけ出さない。公開は取り消せない）。
  publish-crate:
    needs: release
    # crate_only のときは release が飛ばされるので、飛ばされたときも走らせる
    if: ${{ !cancelled() && (needs.release.result == 'success' || (inputs.crate_only && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      # タグと Cargo.toml の版がずれていたら止める。既に公開済みの版なら飛ばす（workflow_dispatch の再実行で落ちないように）
      - name: Check version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sennit") | .version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::タグ $TAG と Cargo.toml の版 $version がずれている"
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'sennit-release (github.com/ken109/sennit)' "https://crates.io/api/v1/crates/sennit/$version")"
          if [ "$code" = 200 ]; then
            echo "sennit $version は crates.io に公開済み。飛ばす"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.skip != 'true'
        id: auth

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
